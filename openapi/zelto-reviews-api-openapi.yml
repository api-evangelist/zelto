openapi: 3.2.0
info:
  title: Zelto REST Reviews API
  version: v1
  description: Programmatic access to your Zelto organization. Every endpoint is scoped to the organization the API key belongs to. Mint a key at Settings → Integrations → API Call Upload.
servers:
- url: https://api.zelto.ai
  description: Production
security:
- bearerAuth: []
tags:
- name: Reviews
  description: Human review state for conversations.
paths:
  /v1/reviews:
    get:
      summary: List reviews
      operationId: listReviews
      tags:
      - Reviews
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - reviewed
          - flagged
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of reviews.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/reviews/{id}:
    get:
      summary: Get a review
      operationId: getReview
      tags:
      - Reviews
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Human-readable error message, e.g. Unauthorized or Validation failed.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageEnvelope:
      type: object
      required:
      - data
      - nextCursor
      properties:
        data:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
    Review:
      type: object
      required:
      - id
      - entityType
      - entityId
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
          enum:
          - call
          - agent
          description: Reviewed entity type.
        entityId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - reviewed
          - flagged
        reviewerId:
          type: string
          format: uuid
          nullable: true
        aiModel:
          type: string
          nullable: true
        aiGeneratedAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page. Default 50, max 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor. Pass the `nextCursor` returned by the previous page.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found in your organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Send `Authorization: Bearer YOUR_API_KEY`. The key resolves to a single organization.'
